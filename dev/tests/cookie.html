<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickEvent · Cookie Commands</title>
</head>
<body>
  <h1>Cookie Commands</h1>

  <section>
    <h2>1. Set Cookies First</h2>
    <button click='["setCookie", "theme", "dark", {"expires": 3600, "path": "/"}]'>Set theme=dark</button>
    <button click='["setCookie", "lang", "fa", {"expires": 3600}]'>Set lang=fa</button>
    <button click='["setCookie", "user", "alex", {"expires": 86400}]'>Set user=alex</button>
  </section>

  <section>
    <h2>2. Read Cookies</h2>
    <div>Result: <span id="output">(empty)</span></div>
    <button click='["setText", "#output", ["getCookie", "theme"]]'>Read theme</button>
    <button click='["setText", "#output", ["getCookie", "lang"]]'>Read lang</button>
    <button click='["setText", "#output", ["getCookie", "user"]]'>Read user</button>
    <button click='["setText", "#output", ["getCookie", "missing"]]'>Read missing (should be empty)</button>
  </section>

  <section>
    <h2>3. Alias & Expression</h2>
    <div>Result: <span id="output2">(empty)</span></div>
    <button click='["setText", "#output2", ["getCookie", ["user", "u"], "{ upperCase(u) }"]]'>Read user (alias + expr)</button>
    <button click='[
      ["getCookie", ["lang", "l"]],
      ["setText", "#output2", "lang is { l }"]
    ]'>Read lang (separate lines)</button>
  </section>

  <section>
    <h2>4. Remove Cookies</h2>
    <button click='["removeCookie", "theme"]'>Remove theme</button>
    <button click='["removeCookie"]'>Remove all</button>
    <button click='["setText", "#output", "check after remove"]'>Refresh output</button>
  </section>

  <script type="module" src="./setup.js"></script>
</body>
</html>
