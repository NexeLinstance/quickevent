<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Window Properties Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; line-height: 1.8; }
    button { margin: 4px; padding: 6px 12px; cursor: pointer; }
    #window { background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 16px; border-radius: 4px; min-height: 30px; }
    .group { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Window Properties</h1>
  <p>Output: <strong id="window">-</strong></p>

  <!-- 1. Dimensions (ابعاد) -->
  <div class="group">
    <h3>ابعاد (Dimensions)</h3>
    <button click='["setText", "#window", "innerWidth: {window.innerWidth}"]'>innerWidth (عرض ویوپورت)</button>
    <button click='["setText", "#window", "innerHeight: {window.innerHeight}"]'>innerHeight (ارتفاع ویوپورت)</button>
    <button click='["setText", "#window", "outerWidth: {window.outerWidth}"]'>outerWidth (عرض کل پنجره)</button>
    <button click='["setText", "#window", "outerHeight: {window.outerHeight}"]'>outerHeight (ارتفاع کل پنجره)</button>
    <button click='["setText", "#window", "devicePixelRatio: {window.devicePixelRatio}"]'>devicePixelRatio (تراکم پیکسل)</button>
  </div>

  <!-- 2. Screen (صفحه نمایش) -->
  <div class="group">
    <h3>صفحه نمایش (Screen)</h3>
    <button click='["setText", "#window", "screen.width: {window.screen.width}"]'>screen.width</button>
    <button click='["setText", "#window", "screen.height: {window.screen.height}"]'>screen.height</button>
    <button click='["setText", "#window", "screen.availWidth: {window.screen.availWidth}"]'>screen.availWidth</button>
    <button click='["setText", "#window", "screen.availHeight: {window.screen.availHeight}"]'>screen.availHeight</button>
  </div>

  <!-- 3. Scroll Position (موقعیت اسکرول) -->
  <div class="group">
    <h3>موقعیت اسکرول (Scroll)</h3>
    <button click='["setText", "#window", "scrollX: {window.scrollX}"]'>scrollX</button>
    <button click='["setText", "#window", "scrollY: {window.scrollY}"]'>scrollY</button>
    <button click='["setText", "#window", "pageXOffset: {window.pageXOffset}"]'>pageXOffset</button>
    <button click='["setText", "#window", "pageYOffset: {window.pageYOffset}"]'>pageYOffset</button>
  </div>

  <!-- 4. Location (آدرس) -->
  <div class="group">
    <h3>آدرس (Location)</h3>
    <button click='["setText", "#window", "location.href: {window.location.href}"]'>location.href</button>
    <button click='["setText", "#window", "location.hostname: {window.location.hostname}"]'>location.hostname</button>
    <button click='["setText", "#window", "location.pathname: {window.location.pathname}"]'>location.pathname</button>
    <button click='["setText", "#window", "location.search: {window.location.search}"]'>location.search</button>
    <button click='["setText", "#window", "location.hash: {window.location.hash}"]'>location.hash</button>
    <button click='["setText", "#window", "location.protocol: {window.location.protocol}"]'>location.protocol</button>
  </div>

  <!-- 5. Document & Title (سند و عنوان) -->
  <div class="group">
    <h3>سند و عنوان (Document)</h3>
    <button click='["setText", "#window", "document.title: {window.document.title}"]'>document.title</button>
    <button click='["setText", "#window", "document.URL: {window.document.URL}"]'>document.URL</button>
    <button click='["setText", "#window", "document.referrer: {window.document.referrer}"]'>document.referrer</button>
  </div>

  <!-- 6. History (تاریخچه) -->
  <div class="group">
    <h3>تاریخچه (History)</h3>
    <button click='["setText", "#window", "history.length: {window.history.length}"]'>history.length (تعداد صفحات در تاریخچه)</button>
  </div>

  <!-- 7. Navigator (اطلاعات مرورگر) -->
  <div class="group">
    <h3>اطلاعات مرورگر (Navigator)</h3>
    <button click='["setText", "#window", "navigator.userAgent: {window.navigator.userAgent}"]'>navigator.userAgent</button>
    <button click='["setText", "#window", "navigator.language: {window.navigator.language}"]'>navigator.language</button>
    <button click='["setText", "#window", "navigator.platform: {window.navigator.platform}"]'>navigator.platform</button>
    <button click='["setText", "#window", "navigator.cookieEnabled: {window.navigator.cookieEnabled}"]'>navigator.cookieEnabled</button>
    <button click='["setText", "#window", "navigator.onLine: {window.navigator.onLine}"]'>navigator.onLine</button>
  </div>

  <!-- 8. Misc (سایر) -->
  <div class="group">
    <h3>سایر (Misc)</h3>
    <button click='["setText", "#window", "name: {window.name}"]'>window.name</button>
    <button click='["setText", "#window", "closed: {window.closed}"]'>window.closed</button>
    <button click='["setText", "#window", "isSecureContext: {window.isSecureContext}"]'>isSecureContext</button>
  </div>

  <script type="module" src="./setup.js"></script>
</body>
</html>
