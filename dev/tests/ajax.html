<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickEvent · AJAX</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    h2 { margin-bottom: 4px; }
    p.desc { color: #666; margin-top: 0; margin-bottom: 12px; }
    button { margin: 4px 4px 4px 0; padding: 6px 12px; cursor: pointer; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
    .row { margin: 8px 0; }
    .label { display: inline-block; min-width: 90px; color: #555; }
    .target { background: #fffbe6; padding: 4px 10px; border: 1px solid #f0e0a0; border-radius: 4px; display: inline-block; min-width: 120px; }
    .success { background: #cfc; border-color: #8c8; }
    .error   { background: #fcc; border-color: #c88; }
  </style>
</head>
<body>
  <h1>AJAX</h1>

  <!-- ── GET request ─────────────────────────────────────── -->
  <section>
    <h2>GET</h2>
    <p class="desc">Fetch a JSON file. The result is stored in <code>response</code>.</p>
    <div class="row"><span class="label">Target:</span> <span class="target" id="g1-out">(empty)</span></div>
    <button click='[
      ["ajax", "./api.json"],
      ["setText", "#g1-out", "name: { response.name }, version: { response.version }"]
    ]'>get name/version</button>
    <button click='[
      ["ajax", "./api.json"],
      ["setText", "#g1-out", "users: { count(response.users) }"]
    ]'>count users</button>
    <button click='[
      ["ajax", "./api.json"],
      ["for", "u", "{response.users}", [
        ["setText", "#g1-out", "last: { u.name }"]
      ]]
    ]'>last user</button>
  </section>

  <!-- ── GET with query params ─────────────────────────── -->
  <section>
    <h2>GET with query params</h2>
    <div class="row"><span class="label">Target:</span> <span class="target" id="g2-out">(empty)</span></div>
    <button click='[
      ["ajax", "./api.json", "GET", {"q": "test", "page": 2}],
      ["setText", "#g2-out", "loaded: { response.name }"]
    ]'>with query</button>
  </section>

  <!-- ── Success / Error ────────────────────────────────── -->
  <section>
    <h2>Success / Error</h2>
    <div class="row"><span class="label">Target:</span> <span class="target" id="g3-out">(empty)</span></div>
    <button click='[
      ["ajax", "./api.json"],
      ["ajaxSuccess", [
        ["setText", "#g3-out", "SUCCESS: { response.name }"],
        ["addClass", "#g3-out", "success"]
      ]],
      ["ajaxError", [
        ["setText", "#g3-out", "ERROR: { response.status_message }"],
        ["addClass", "#g3-out", "error"]
      ]]
    ]'>valid file</button>
    <button click='[
      ["ajax", "./does-not-exist.json"],
      ["ajaxSuccess", [
        ["setText", "#g3-out", "SUCCESS (won't happen)"],
        ["addClass", "#g3-out", "success"]
      ]],
      ["ajaxError", [
        ["setText", "#g3-out", "ERROR: { response.status_message }"],
        ["addClass", "#g3-out", "error"]
      ]]
    ]'>missing file (error)</button>
  </section>

  <!-- ── Custom error messages ──────────────────────────── -->
  <section>
    <h2>Custom error messages</h2>
    <div class="row"><span class="label">Target:</span> <span class="target" id="g4-out">(empty)</span></div>
    <button click='[
      ["ajax", "./does-not-exist.json"],
      ["ajaxSuccess", [
        ["setText", "#g4-out", "ok"]
      ]],
      ["ajaxError", [
        ["setText", "#g4-out", "custom: { response.status_message }"]
      ], { 404: "This item has been removed." }]
    ]'>404 with custom message</button>
  </section>

  <!-- ── Nested AJAX → setHtml ─────────────────────────── -->
  <section>
    <h2>Nested AJAX as argument</h2>
    <div class="row"><span class="label">Target:</span> <div class="target" id="g5-out">(empty)</div></div>
    <button click='[
      ["setHtml", "#g5-out", ["ajax", "./api.json"]]
    ]'>setHtml (will show object)</button>
  </section>

  <!-- ── Errors ──────────────────────────────────────────── -->
  <section>
    <h2>Errors (expected)</h2>
    <div class="row"><span class="label">Target:</span> <span class="target" id="g6-out">(empty)</span></div>
    <button click='["ajax"]'>ajax missing url</button>
    <button click='["ajax", 123]'>ajax url not string (schema)</button>
  </section>

  <script type="module" src="./setup.js"></script>
</body>
</html>
