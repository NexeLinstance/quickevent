<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickEvent · Func Commands</title>
</head>
<body>
  <h1>Func Commands</h1>

  <div id="my-div" set_spans='["createFunc", ["span_selector", {"text": "this is text"}], ["setText", "{span_selector}", "{text}"]]'></div>

  <section>
    <h2>callFunc</h2>
    <p>Target: <span id="target-span">initial</span></p>
    <button click='["callFunc", "set_spans", "#my-div", ["#target-span", "changed by function!"]]'>
      Call set_spans
    </button>
    <button click='["callFunc", "set_spans", "#my-div", ["#target-span"]]'>
      Call with default text
    </button>
  </section>

  <section>
    <h2>runFunc</h2>
    <p>Runs a JS function from a file.</p>
    <button click='["runFunc", "/dev/tests/helpers.js", "greet", "Alex"]'>
      Run external JS function
    </button>
  </section>

  <script type="module" src="./setup.js"></script>
</body>
</html>
