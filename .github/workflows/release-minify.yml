name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Download DOMPurify
        run: |
          mkdir -p dist/lib
          curl -fL -o dist/lib/purify.min.js "https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"

      - name: Copy Markers CSS to dist
        run: |
          mkdir -p dist
          cp src/assets/quickevent-markers.css dist/quickevent-markers.css

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/quickevent.min.js \
            dist/lib/purify.min.js \
            dist/quickevent-markers.css \
            --clobber

      - name: Push to cdn branch and update tags
        run: |
          mkdir -p /tmp/cdn-tmp/lib
          cp dist/quickevent.min.js /tmp/cdn-tmp/quickevent.min.js
          cp dist/lib/purify.min.js /tmp/cdn-tmp/lib/purify.min.js
          cp dist/quickevent-markers.css /tmp/cdn-tmp/quickevent-markers.css

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan cdn
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -r /tmp/cdn-tmp/* .
          git add quickevent.min.js quickevent-markers.css lib/purify.min.js
          git commit -m "cdn: ${GITHUB_REF_NAME}"
          git push -f origin cdn

          git tag -f latest
          git push origin latest -f

          if echo "${{ github.event.release.body }}" | grep -q "\[stable\]"; then
            echo "Marking this release as stable..."
            git tag -f stable
            git push origin stable -f
          fi

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@latest/quickevent.min.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@latest/quickevent-markers.css" || true
          
          if echo "${{ github.event.release.body }}" | grep -q "\[stable\]"; then
            curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@stable/quickevent.min.js" || true
            curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@stable/quickevent-markers.css" || true
          fi