name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Download DOMPurify
        run: |
          mkdir -p dist/lib
          # دانلود مستقیم آخرین نسخه از jsDelivr (بسیار مطمئن‌تر از API گیت‌هاب)
          echo "Downloading DOMPurify from jsDelivr..."
          curl -fL -o dist/lib/purify.min.js "https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"

      - name: Copy Markers CSS to dist
        run: |
          mkdir -p dist
          cp src/assets/quickevent-markers.css dist/quickevent-markers.css

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/quickevent.min.js \
            dist/lib/purify.min.js \
            dist/quickevent-markers.css \
            --clobber

      - name: Push to cdn branch
        run: |
          mkdir -p cdn-tmp/lib
          cp dist/quickevent.min.js cdn-tmp/quickevent.min.js
          cp dist/lib/purify.min.js cdn-tmp/lib/purify.min.js
          cp dist/quickevent-markers.css cdn-tmp/quickevent-markers.css

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan cdn
          git rm -rf . >/dev/null 2>&1 || true
          
          cp -r cdn-tmp/* .
          rm -rf cdn-tmp
          
          git add -A
          git commit -m "cdn: ${GITHUB_REF_NAME}"
          git push -f origin cdn

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@cdn/quickevent.min.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@cdn/quickevent-markers.css" || true
          curl -fsS "https://purge.jsdelivr.net/gh/NexeLinstance/quickevent@cdn/lib/purify.min.js" || true