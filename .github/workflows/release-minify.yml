name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Copy DOMPurify to dist
        run: |
          mkdir -p dist/lib
          cp src/lib/purify.min.js dist/lib/purify.min.js

      - name: Copy Markers CSS to dist
        run: |
          mkdir -p dist
          cp src/assets/quickevent-markers.css dist/quickevent-markers.css

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/quickevent.min.js \
            dist/lib/purify.min.js \
            dist/quickevent-markers.css \
            --clobber