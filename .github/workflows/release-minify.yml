name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug - Check files before build
        run: |
          echo "=== Checking package.json ==="
          cat package.json | grep version
          echo "=== Checking src/quickevent.js ==="
          cat src/quickevent.js
          echo "=== Checking src/core/sanitize.js ==="
          cat src/core/sanitize.js

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Debug - Check output file
        run: |
          echo "=== Searching for 'QuickEvent' in dist ==="
          grep -o "QuickEvent.*loaded" dist/quickevent.min.js || echo "NOT FOUND!"
          echo "=== Searching for 'purify' in dist ==="
          grep -o "purify.min.js" dist/quickevent.min.js || echo "NOT FOUND!"

      - name: Copy DOMPurify to dist
        run: |
          mkdir -p dist/lib
          cp src/lib/purify.min.js dist/lib/purify.min.js

      - name: Commit and Push dist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f dist/quickevent.min.js dist/lib/purify.min.js
          
          if git diff --cached --quiet; then
            echo "No changes to dist, skipping commit."
          else
            git commit -m "chore: build dist for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/quickevent.min.js \
            dist/lib/purify.min.js \
            --clobber